name: Build Essentials Pumpkin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Build
        run: cargo build --release --target wasm32-wasip2

      - name: Prepare plugin
        run: cp target/wasm32-wasip2/release/essentials_pumpkin.wasm essentials_pumpkin.wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: essentials_pumpkin
          path: essentials_pumpkin.wasm

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Essentials Pumpkin build ${{ github.run_number }}
          files: essentials_pumpkin.wasm
          generate_release_notes: false
